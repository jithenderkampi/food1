<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="navbar">
            <div class="logo">OneFood</div>
            <ul class="link">
                <li>Home</li>
                <li>Menu</li>
                <li>About</li>
                <li>Gallery</li>
                <li>Contact</li>
            </ul>
            <div class="icons">
                <i class="fa-solid fa-magnifying-glass"></i>
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>
        <div class="banner">
            <div class="left">
                <span class="left1">Are You Angry?</span>
                <span class="left2">Don't Wait</span>
                <span class="left3">lets start order food now</span>
                <span class="left4">check out menu</span>
            </div>
            <div class="right" id="right"></div>
        </div>
        <div class="items">
            <div id="item1"></div>
            <div id="item2"></div>
            <div id="item3"></div>
            <div id="item4"></div>
        </div>
    </div>
</body>
<script>
    let food = document.getElementById("right");
    let food1 = document.getElementById("item1");
    let food2 = document.getElementById("item2");
    let food3 = document.getElementById("item3");
    let food4 = document.getElementById("item4");

    food1.addEventListener('click', ()=>{
        food.style.backgroundImage = "url('images/food1.png')"
    });
    food2.addEventListener('click', ()=>{
        food.style.backgroundImage = "url('images/food2.png')"
    });
    food3.addEventListener('click', ()=>{
        food.style.backgroundImage = "url('images/food3.png')"
    });
    food4.addEventListener('click', ()=>{
        food.style.backgroundImage = "url('images/food4.png')"
    });
</script>
</html>
